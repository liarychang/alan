<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alan家族怪盜聯盟</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Noto+Serif+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#c9a030;--gold2:#e0b840;--night:#0d0a18;--day:#f0e8cc;--ink:#1e1000;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Serif TC',serif;background:var(--night);color:#e8d8a8;min-height:100vh;transition:background 1.2s,color 1.2s;}
body.is-day{background:var(--day);color:var(--ink);}
.screen{display:none;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px 90px;text-align:center;}
.screen.active{display:flex;}
.content{position:relative;z-index:1;width:100%;max-width:540px;}
#particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.pt{position:absolute;width:2px;height:2px;border-radius:50%;background:rgba(200,160,50,.5);opacity:0;animation:pt-up linear infinite;}
@keyframes pt-up{0%{opacity:0;transform:translateY(0)}20%{opacity:.5}100%{opacity:0;transform:translateY(-130px)}}
/* TYPOGRAPHY */
.cinzel{font-family:'Cinzel Decorative',serif;}
.big-title{font-family:'Cinzel Decorative',serif;font-size:clamp(28px,8vw,50px);color:var(--gold2);line-height:1.25;text-shadow:0 0 40px rgba(200,160,50,.4);}
.sub-label{font-size:14px;letter-spacing:6px;color:rgba(200,160,50,.65);text-transform:uppercase;}
.night-title{font-size:clamp(24px,7vw,44px);font-weight:900;color:var(--gold2);line-height:1.3;margin-bottom:12px;}
.night-sub{font-size:18px;color:#b8a070;margin-bottom:24px;line-height:2;}
.is-day .night-title{color:#6a3e00;}.is-day .night-sub{color:#7a5020;}
.div-line{width:150px;height:1px;background:linear-gradient(to right,transparent,var(--gold),transparent);margin:20px auto;}
/* BUTTONS */
.btn{font-family:'Noto Serif TC',serif;font-weight:700;font-size:19px;letter-spacing:2px;padding:19px 48px;border:none;border-radius:100px;cursor:pointer;transition:all .3s;}
.btn-gold{background:linear-gradient(135deg,#9a7820,#6e5214);color:#ffe070;box-shadow:0 0 24px rgba(180,140,30,.3),0 4px 22px rgba(0,0,0,.6);}
.btn-gold:hover{transform:translateY(-2px);}
.btn-ghost{background:rgba(255,255,255,.06);color:#c8a040;border:2px solid rgba(200,160,40,.4);font-size:17px;padding:13px 34px;}
.btn-ghost:hover{background:rgba(200,160,40,.1);}
.btn-red{background:linear-gradient(135deg,#7a1818,#540e0e);color:#ffcccc;box-shadow:0 4px 22px rgba(0,0,0,.6);font-size:19px;}
.btn-red:hover{transform:translateY(-2px);}
.btn-day{background:linear-gradient(135deg,#8a5800,#603c00);color:#ffe8a0;font-size:19px;}
.btn-day:hover{transform:translateY(-2px);}
.btn-green{background:linear-gradient(135deg,#2a6a10,#1a4808);color:#c0ff80;font-size:19px;}
.btn-green:hover{transform:translateY(-2px);}
/* COUNT SELECTOR */
.count-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 18px;}
.cnt-btn{font-family:'Noto Serif TC',serif;font-size:16px;font-weight:700;padding:11px 20px;border:2px solid rgba(200,160,50,.3);border-radius:14px;cursor:pointer;background:transparent;color:#b09040;transition:all .3s;}
.cnt-btn.active{background:linear-gradient(135deg,#9a7820,#6e5214);color:#ffe070;border-color:#c0a030;box-shadow:0 0 14px rgba(180,140,20,.3);}
/* INPUTS */
.player-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.inp-wrap{position:relative;}
.inp-ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:19px;pointer-events:none;}
.inp{width:100%;background:rgba(255,255,255,.07);border:2px solid rgba(200,160,50,.3);border-radius:11px;padding:14px 12px 14px 44px;color:#e8cc70;font-family:'Noto Serif TC',serif;font-size:17px;outline:none;transition:all .3s;}
.inp:focus{border-color:rgba(200,160,50,.7);background:rgba(200,160,50,.08);}
.inp::placeholder{color:rgba(200,160,50,.35);}
.inp-wrap.hidden{display:none;}
/* ROLE BADGES */
.roles-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0;}
.rbadge{background:rgba(255,255,255,.06);border:2px solid rgba(200,160,50,.28);border-radius:100px;padding:8px 18px;font-size:15px;color:#d4aa50;}
.rbadge.evil{border-color:rgba(200,60,60,.4);color:#ff9898;}
/* PLAYER SELECT CARDS */
.psel-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin:16px 0;}
.psel-grid.g3{grid-template-columns:1fr 1fr 1fr;}
.psel-card{border-radius:18px;padding:20px 13px;cursor:pointer;transition:all .3s;border:2px solid rgba(200,160,50,.18);background:linear-gradient(145deg,#181428,#100e1e);position:relative;overflow:hidden;user-select:none;}
.psel-card:hover:not(.dead):not(.no-pick){border-color:rgba(200,160,50,.6);transform:translateY(-3px);}
.psel-card.sel-gold{border-color:var(--gold2);background:linear-gradient(145deg,#201400,#160e00);box-shadow:0 0 22px rgba(200,160,30,.3);}
.psel-card.sel-red{border-color:#cc3030;background:linear-gradient(145deg,#200808,#160404);box-shadow:0 0 22px rgba(180,40,40,.35);}
.psel-card.sel-green{border-color:#50c030;background:linear-gradient(145deg,#0a2008,#061404);}
.psel-card.dead{opacity:.3;pointer-events:none;}
.psel-card.no-pick{opacity:.35;pointer-events:none;}
.psel-emoji{font-size:36px;display:block;margin-bottom:9px;}
.psel-name{font-size:17px;font-weight:900;color:#d4aa50;}
.psel-tag{position:absolute;top:7px;right:7px;font-size:11px;border-radius:5px;padding:3px 7px;font-weight:700;}
.tag-dead{background:rgba(180,40,40,.5);color:#ffbbbb;}
.tag-idiot{background:rgba(180,100,0,.5);color:#ffcc80;}
.no-hint{font-size:12px;color:#a08040;margin-top:4px;}
.is-day .psel-card{background:linear-gradient(145deg,#fff8e8,#f5eccc);border-color:rgba(160,100,0,.2);}
.is-day .psel-card:hover:not(.dead):not(.no-pick){border-color:rgba(160,100,0,.5);}
.is-day .psel-card.sel-red{border-color:#c02020;background:#fff0ee;}
.is-day .psel-card.sel-gold{border-color:#b08820;background:#fffae0;}
.is-day .psel-name{color:#5a3400;}
/* SPECIAL BOXES */
.info-box{border-radius:16px;padding:18px 20px;margin:12px 0;font-size:18px;line-height:2;font-weight:700;}
.box-death{background:rgba(160,30,30,.2);border:2px solid rgba(180,50,50,.5);color:#ffbbbb;}
.box-safe{background:rgba(30,120,60,.2);border:2px solid rgba(40,150,80,.5);color:#a0ffcc;}
.box-hunter{background:rgba(60,120,20,.2);border:2px solid rgba(80,160,30,.5);color:#c8ff80;}
.box-witch{background:rgba(120,40,180,.2);border:2px solid rgba(140,60,200,.5);color:#d0a0ff;}
.box-idiot{background:rgba(180,100,0,.15);border:2px solid rgba(200,120,0,.4);color:#ffcc80;}
.box-wolf-see{background:rgba(160,30,30,.15);border:2px solid rgba(200,50,50,.4);color:#ffbbbb;}
.is-day .box-death{background:#fff0ee;border-color:#dd8080;color:#7a0000;}
.is-day .box-safe{background:#ecfff4;border-color:#70c090;color:#0a4e22;}
.is-day .box-hunter{background:#f5ffe8;border-color:#88cc40;color:#2a5000;}
/* SEER REVEAL */
.reveal-box{background:linear-gradient(145deg,#1a1000,#100c00);border:2px solid rgba(200,160,50,.5);border-radius:18px;padding:26px 22px;margin:12px 0;animation:pop-in .4s cubic-bezier(.175,.885,.32,1.275);}
@keyframes pop-in{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@keyframes big-pop{from{opacity:0;transform:scale(.6) rotate(-12deg)}to{opacity:1;transform:scale(1) rotate(0)}}
.reveal-emoji{font-size:58px;display:block;margin-bottom:10px;}
.reveal-name{font-family:'Cinzel Decorative',serif;font-size:22px;color:var(--gold2);}
.reveal-team{font-size:16px;font-weight:700;padding:7px 18px;border-radius:10px;display:inline-block;margin-top:8px;}
.team-good{background:rgba(40,160,80,.2);color:#80ffb0;border:1px solid rgba(40,160,80,.4);}
.team-evil{background:rgba(180,40,40,.2);color:#ffaaaa;border:1px solid rgba(180,40,40,.4);}
/* WITCH UI */
.witch-block{background:rgba(255,255,255,.04);border:2px solid rgba(140,60,200,.3);border-radius:16px;padding:16px 18px;margin:10px 0;text-align:left;}
.witch-block-title{font-size:17px;font-weight:900;color:#d0a0ff;margin-bottom:10px;}
.w-btns{display:flex;gap:10px;flex-wrap:wrap;}
.w-btn{font-family:'Noto Serif TC',serif;font-size:16px;font-weight:700;padding:11px 20px;border:2px solid;border-radius:100px;cursor:pointer;transition:all .3s;}
.w-btn-heal{background:rgba(40,160,100,.15);color:#80ffcc;border-color:rgba(40,160,100,.5);}
.w-btn-skip{background:rgba(255,255,255,.04);color:#a09070;border-color:rgba(255,255,255,.15);}
/* STATUS BAR */
.status-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:20px;}
.status-pip{border:2px solid rgba(200,160,50,.25);border-radius:100px;padding:7px 15px;font-size:15px;}
.status-pip.alive{border-color:rgba(200,160,50,.55);color:#d4aa50;}
.status-pip.dead{opacity:.3;text-decoration:line-through;}
.status-pip.no-vote{border-color:rgba(200,120,0,.5);color:#ffcc80;text-decoration:line-through;}
.is-day .status-pip.alive{border-color:rgba(120,80,0,.5);color:#6a4000;}
/* TIMER */
.timer-wrap{position:relative;width:106px;height:106px;margin:0 auto 18px;}
.t-svg{width:106px;height:106px;transform:rotate(-90deg);}
.t-track{fill:none;stroke:rgba(255,255,255,.1);stroke-width:6;}
.t-prog{fill:none;stroke:var(--gold2);stroke-width:6;stroke-linecap:round;stroke-dasharray:302;stroke-dashoffset:0;filter:drop-shadow(0 0 8px var(--gold));transition:stroke-dashoffset 1s linear,stroke .3s;}
.t-num{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Cinzel Decorative',serif;font-size:30px;color:var(--gold2);}
/* GAME LOG */
.game-log{background:rgba(255,255,255,.05);border:2px solid rgba(200,160,50,.2);border-radius:13px;padding:13px 17px;text-align:left;font-size:15px;line-height:2.2;color:#b09860;margin:10px 0;max-height:120px;overflow-y:auto;}
.is-day .game-log{background:#fff8e0;border-color:#d0b050;color:#6a4a10;}
/* ROLE TABLE */
.rr-table{border-radius:16px;overflow:hidden;margin:14px 0;border:2px solid rgba(200,160,50,.25);}
.rr-head{background:rgba(200,160,50,.15);font-size:13px;letter-spacing:3px;color:#c0a040;padding:11px 18px;display:flex;justify-content:space-between;font-weight:700;}
.rr-row{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.07);font-size:17px;color:#d4aa50;}
.rr-row:last-child{border-bottom:none;}
.rr-role{display:flex;align-items:center;gap:7px;}
.rr-tag{font-size:11px;border-radius:5px;padding:2px 8px;font-weight:700;margin-left:4px;}
.rr-tag-dead{background:rgba(180,40,40,.35);color:#ffbbbb;border:1px solid rgba(180,40,40,.4);}
.rr-tag-idiot{background:rgba(180,100,0,.35);color:#ffcc80;border:1px solid rgba(180,100,0,.4);}
.is-day .rr-table{border-color:#d0b050;}
.is-day .rr-head{background:#fff0c8;color:#7a5800;}
.is-day .rr-row{border-color:#e8d080;color:#5a3800;}
/* SCORE DOCK */
.score-dock{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(8,6,18,.98);border-top:2px solid rgba(200,160,50,.2);backdrop-filter:blur(20px);max-height:52px;overflow:hidden;transition:max-height .4s ease;}
.score-dock.open{max-height:380px;}
.score-toggle{display:flex;align-items:center;justify-content:space-between;padding:13px 22px;cursor:pointer;}
.score-toggle>span{font-family:'Cinzel Decorative',serif;font-size:14px;color:#c0a040;}
.score-arr{transition:transform .3s;color:#c0a040;}
.score-dock.open .score-arr{transform:rotate(180deg);}
.score-body{padding:4px 22px 18px;}
.score-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:16px;color:#c0a040;}
.score-row:last-child{border-bottom:none;}
.score-pts{font-family:'Cinzel Decorative',serif;font-size:20px;color:#d4b848;}
.score-rst{background:transparent;border:2px solid rgba(180,40,40,.4);color:#dd6060;border-radius:100px;padding:7px 18px;font-size:13px;cursor:pointer;margin-top:10px;font-family:'Noto Serif TC',serif;transition:all .3s;font-weight:700;}
.score-rst:hover{border-color:rgba(180,40,40,.8);color:#ff8080;}
/* TOAST */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-90px);background:rgba(15,12,30,.97);border:2px solid rgba(200,160,50,.5);border-radius:13px;padding:13px 24px;font-size:17px;color:var(--gold2);z-index:999;transition:transform .4s cubic-bezier(.175,.885,.32,1.275);backdrop-filter:blur(12px);white-space:nowrap;font-weight:700;}
.toast.show{transform:translateX(-50%) translateY(0);}
.cft{position:fixed;top:-12px;opacity:0;animation:cft-fall linear forwards;z-index:998;pointer-events:none;border-radius:2px;}
@keyframes cft-fall{0%{opacity:1;transform:translateY(0) rotateZ(0)}100%{opacity:0;transform:translateY(100vh) rotateZ(720deg)}}
.big-icon{font-size:84px;margin-bottom:16px;}
.moon-anim{animation:moon-glow 4s ease-in-out infinite;}
@keyframes moon-glow{0%,100%{filter:drop-shadow(0 0 14px rgba(200,160,50,.4))}50%{filter:drop-shadow(0 0 36px rgba(200,160,50,.7))}}
.sun-anim{animation:sun-spin 14s linear infinite;}
@keyframes sun-spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@media(max-width:380px){.psel-grid,.player-grid{grid-template-columns:1fr;}.psel-grid.g3{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>
<div id="particles"></div>
<div class="toast" id="toast"></div>

<!-- ═══════ OPENING ═══════ -->

<div class="screen active" id="sOpening">
<div class="content">
  <div class="big-icon moon-anim">🎩</div>
  <div class="big-title">Alan家族<br>怪盜聯盟</div>
  <div class="sub-label" style="margin:6px 0 20px;">天黑請閉眼 Edition</div>
  <div class="div-line"></div>
  <div style="font-size:17px;color:#c0a040;margin-bottom:12px;letter-spacing:3px;font-weight:700;">選擇人數</div>
  <div class="count-row">
    <button class="cnt-btn" id="btn3" onclick="setCount(3)">3人</button>
    <button class="cnt-btn active" id="btn4" onclick="setCount(4)">4人</button>
    <button class="cnt-btn" id="btn5" onclick="setCount(5)">5人</button>
    <button class="cnt-btn" id="btn6" onclick="setCount(6)">6人</button>
    <button class="cnt-btn" id="btn7" onclick="setCount(7)">7人</button>
    <button class="cnt-btn" id="btn8" onclick="setCount(8)">8人</button>
  </div>
  <div class="roles-row" id="rolesRow"></div>
  <div class="player-grid" id="pGrid">
    <div class="inp-wrap"><span class="inp-ico">👑</span><input class="inp" id="p0" value="Alan"  placeholder="玩家1"></div>
    <div class="inp-wrap"><span class="inp-ico">🌸</span><input class="inp" id="p1" value="媽媽"  placeholder="玩家2"></div>
    <div class="inp-wrap"><span class="inp-ico">⚡</span><input class="inp" id="p2" value="哥哥"  placeholder="玩家3"></div>
    <div class="inp-wrap" id="w3"><span class="inp-ico">🌈</span><input class="inp" id="p3" value="妹妹"  placeholder="玩家4"></div>
    <div class="inp-wrap" id="w4"><span class="inp-ico">🌟</span><input class="inp" id="p4" value="爸爸"  placeholder="玩家5"></div>
    <div class="inp-wrap" id="w5"><span class="inp-ico">🦋</span><input class="inp" id="p5" value="姐姐"  placeholder="玩家6"></div>
    <div class="inp-wrap" id="w6"><span class="inp-ico">🎯</span><input class="inp" id="p6" value="叔叔"  placeholder="玩家7"></div>
    <div class="inp-wrap" id="w7"><span class="inp-ico">🔥</span><input class="inp" id="p7" value="阿姨"  placeholder="玩家8"></div>
  </div>
  <button class="btn btn-gold" onclick="startGame()">開始遊戲</button>
</div>
</div>

<!-- ═══════ DEAL ═══════ -->

<div class="screen" id="sDeal">
<div class="content">
  <div class="sub-label" style="margin-bottom:14px;">秘密發牌</div>
  <div class="cinzel" id="dealName" style="font-size:clamp(24px,8vw,42px);color:var(--gold2);margin-bottom:8px;"></div>
  <div style="font-size:17px;color:#b09850;letter-spacing:2px;margin-bottom:22px;">確認只有你看到螢幕後翻牌</div>
  <div id="cardScene" style="width:215px;height:285px;perspective:1200px;cursor:pointer;margin:0 auto 20px;">
    <div id="dealCard" style="width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.4,0,.2,1);">
      <div style="position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;background:linear-gradient(145deg,#141428,#0c0c1e);border:2px solid rgba(200,160,50,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;">
        <div style="width:78px;height:78px;border:2px solid rgba(200,160,50,.4);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;">🎩</div>
        <div style="font-size:13px;letter-spacing:5px;color:#c0a040;font-weight:700;">TAP TO REVEAL</div>
      </div>
      <div id="dealBack" style="position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;background:linear-gradient(145deg,#1e1200,#140c00);border:2px solid rgba(200,160,50,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transform:rotateY(180deg);padding:22px;">
        <div id="dRoleEmoji" style="font-size:68px;"></div>
        <div id="dRoleName" style="font-family:'Cinzel Decorative',serif;font-size:21px;color:var(--gold2);"></div>
        <div id="dRoleDesc" style="font-size:16px;color:#c0a060;line-height:1.9;white-space:pre-line;"></div>
        <div id="dWolfSee" style="font-size:14px;color:#ff9898;margin-top:4px;line-height:1.9;"></div>
      </div>
    </div>
  </div>
  <div style="max-width:340px;margin:0 auto 6px;">
    <div style="display:flex;justify-content:space-between;font-size:16px;color:#b09850;letter-spacing:2px;margin-bottom:8px;font-weight:700;"><span>發牌進度</span><span id="dealProg">1/4</span></div>
    <div style="height:5px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;"><div id="dealFill" style="height:100%;background:var(--gold2);box-shadow:0 0 10px var(--gold);border-radius:3px;width:25%;transition:width .5s;"></div></div>
  </div><br>
  <button class="btn btn-gold" id="dealNext" onclick="dealNextPlayer()" style="opacity:.36;pointer-events:none;">下一位 →</button>
</div>
</div>

<!-- ═══════ NIGHT ANNOUNCE ═══════ -->

<div class="screen" id="sNightAnnounce">
<div class="content">
  <div class="big-icon moon-anim">🌙</div>
  <div class="night-title">天黑請閉眼</div>
  <div class="night-sub">所有人請閉上眼睛<br>主持人負責引導遊戲</div>
  <div class="div-line"></div>
  <div style="font-size:18px;color:#c0a040;margin-bottom:34px;line-height:2.6;font-weight:700;">
    夜晚行動順序<br><span id="nightOrderTxt"></span>
  </div>
  <button class="btn btn-gold" onclick="nightBegin()">開始夜晚行動 →</button>
</div>
</div>

<!-- ═══════ NIGHT ACTION ═══════ -->

<div class="screen" id="sNightAction">
<div class="content">
  <div id="nIcon" style="font-size:60px;margin-bottom:12px;"></div>
  <div class="night-title" id="nTitle"></div>
  <div class="night-sub" id="nSub"></div>
  <div id="wolfSeeBox"></div>
  <div class="psel-grid" id="nGrid"></div>
  <div id="seerBox"></div>
  <button class="btn btn-gold" id="nConfirm" onclick="nightConfirm()" style="opacity:.36;pointer-events:none;">確認</button>
</div>
</div>

<!-- ═══════ WITCH ═══════ -->

<div class="screen" id="sWitch">
<div class="content">
  <div style="font-size:60px;margin-bottom:12px;">🧙</div>
  <div class="night-title">女巫請睜眼</div>
  <div class="night-sub" style="margin-bottom:14px;">使用你的神秘藥水</div>
  <div class="witch-block" id="wHealBlock">
    <div class="witch-block-title">🧪 解藥</div>
    <div id="wAttackInfo" style="font-size:17px;color:#e8d8a8;margin-bottom:12px;line-height:1.9;"></div>

<script>
// ═══════════════════════════════
// ROLE DEFINITIONS
// ═══════════════════════════════
var EMOJIS = ['👑','🌸','⚡','🌈','🌟','🦋','🎯','🔥'];
var DEFAULTS = ['Alan','媽媽','哥哥','妹妹','爸爸','姐姐','叔叔','阿姨'];

var ROLE_INFO = {
  '怪盜': {
    emoji:'🕵️', team:'evil',
    desc:'你是怪盜\n今晚選一人攻擊\n說謊欺騙好人！'
  },
  '占星師': {
    emoji:'🔍', team:'good',
    desc:'每晚可查驗\n一位玩家的陣營'
  },
  '守護者': {
    emoji:'🛡', team:'good',
    desc:'每晚保護一人\n不可連續保護同一人'
  },
  '獵人': {
    emoji:'🏹', team:'good',
    desc:'死亡時可帶走一名玩家\n（被投票或夜晚死亡都算）'
  },
  '女巫': {
    emoji:'🧙', team:'good',
    desc:'你有解藥和毒藥\n各可使用一次'
  },
  '白痴': {
    emoji:'🤡', team:'good',
    desc:'若被白天投票放逐\n身份曝光但不死\n但從此不能投票'
  },
  '村民': {
    emoji:'😊', team:'good',
    desc:'普通家人\n靠觀察找出怪盜'
  }
};

// Mode configs: roles list per player count
var MODES = {
  3: ['怪盜','占星師','村民'],
  4: ['怪盜','占星師','守護者','村民'],
  5: ['怪盜','占星師','守護者','獵人','村民'],
  6: ['怪盜','占星師','守護者','獵人','女巫','村民'],
  7: ['怪盜','怪盜','占星師','守護者','獵人','女巫','村民'],
  8: ['怪盜','怪盜','占星師','守護者','獵人','女巫','白痴','村民']
};
// Night order per mode (unique roles)
var NIGHT_ORDERS = {
  3: ['怪盜','占星師'],
  4: ['怪盜','占星師','守護者'],
  5: ['怪盜','占星師','守護者'],
  6: ['怪盜','占星師','守護者','女巫'],
  7: ['怪盜','占星師','守護者','女巫'],
  8: ['怪盜','占星師','守護者','女巫']
};

// ═══════════════════════════════
// GAME STATE
// ═══════════════════════════════
var players=[], shuffled=[], alive=[], canVote=[];
var playerCount=4;
var dealIdx=0, dealFlipped=false;
var nightOrder=[], nightStepIdx=0, nightSel=-1;
var wolfTarget=-1, guardTarget=-1, lastGuard=-1;
var witchHeal=true, witchPoison=true, witchSaving=false, witchPoisonTgt=-1, witchPoisonSel=-1;
var hunterSel=-1, hunterCallback=null;
var idiotCallback=null;
var roundNum=1, gameLog=[], villageWins=false;
var timerInv=null, voteSelected=-1;

// ═══════════════════════════════
// AUDIO
// ═══════════════════════════════
var AC=window.AudioContext?new(window.AudioContext||window.webkitAudioContext)():null;
function beep(f,d,v,t){
  if(!AC)return;if(AC.state==='suspended')AC.resume();
  v=v||.12;t=t||'sine';
  var o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);o.type=t;o.frequency.value=f;
  g.gain.setValueAtTime(v,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);
  o.start();o.stop(AC.currentTime+d);
}
function sndFlip(){beep(420,.18,.1);}
function sndNight(){beep(155,.9,.1,'triangle');}
function sndDawn(){[330,440,550].forEach(function(f,i){setTimeout(function(){beep(f,.4,.1);},i*100);});}
function sndWin(){[440,554,659,880].forEach(function(f,i){setTimeout(function(){beep(f,.5,.12);},i*120);});}
function sndLose(){[220,196,165].forEach(function(f,i){setTimeout(function(){beep(f,.6,.12);},i*160);});}
function sndTick(){beep(920,.05,.06);}
function sndClick(){beep(500,.12,.08);}
function sndHunter(){[660,440,300].forEach(function(f,i){setTimeout(function(){beep(f,.35,.15);},i*80);});}

// ═══════════════════════════════
// PARTICLES
// ═══════════════════════════════
(function(){
  var c=document.getElementById('particles');
  for(var i=0;i<22;i++){
    var p=document.createElement('div');p.className='pt';
    p.style.cssText='left:'+Math.random()*100+'%;bottom:'+Math.random()*55+'%;animation-delay:'+Math.random()*10+'s;animation-duration:'+(4+Math.random()*7)+'s;';
    c.appendChild(p);
  }
})();

// ═══════════════════════════════
// UTILS
// ═══════════════════════════════
function show(id){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  document.getElementById(id).classList.add('active');
}
function setDay(yes){document.body.classList.toggle('is-day',yes);}
function enableBtn(id,yes){
  var b=document.getElementById(id);
  b.style.opacity=yes?'1':'.36';
  b.style.pointerEvents=yes?'auto':'none';
}
function showToast(m){
  var el=document.getElementById('toast');
  el.innerText=m;el.classList.add('show');
  setTimeout(function(){el.classList.remove('show');},2500);
}
function gridClass(n){return n>4?'psel-grid g3':'psel-grid';}
function confetti(){
  var cols=['#c9a030','#a8832a','#f5e080','#ffffff','#80ffaa','#ff9898'];
  for(var i=0;i<80;i++){
    var el=document.createElement('div');el.className='cft';
    var sz=6+Math.random()*9;
    el.style.cssText='left:'+Math.random()*100+'vw;width:'+sz+'px;height:'+sz+'px;background:'+cols[~~(Math.random()*cols.length)]+';border-radius:'+(Math.random()>.5?'50%':'2px')+';animation-duration:'+(1.5+Math.random()*2.5)+'s;animation-delay:'+Math.random()*.9+'s;';
    document.body.appendChild(el);
    setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},4500);
  }
}

// ═══════════════════════════════
// SCORES
// ═══════════════════════════════
function getScores(){
  var o={};
  try{var s=localStorage.getItem('heistv6');if(s)o=JSON.parse(s);}catch(e){}
  players.forEach(function(p){if(!(p in o))o[p]=0;});
  return o;
}
function saveScores(o){localStorage.setItem('heistv6',JSON.stringify(o));}
function renderScores(){
  var o=getScores();
  var sorted=Object.entries(o).sort(function(a,b){return b[1]-a[1];});
  var medals=['🥇','🥈','🥉'];
  var h='';
  sorted.forEach(function(item,i){h+='<div class="score-row"><span>'+(medals[i]||'　')+' '+item[0]+'</span><span class="score-pts">'+item[1]+'</span></div>';});
  h+='<button class="score-rst" onclick="resetScores()">重置積分</button>';
  document.getElementById('sBody').innerHTML=h;
}
function resetScores(){if(!confirm('確定要重置？'))return;saveScores({});renderScores();showToast('✓ 積分已重置');}
function toggleScore(){document.getElementById('sdock').classList.toggle('open');}

// ═══════════════════════════════
// SETUP UI
// ═══════════════════════════════
function setCount(n){
  playerCount=n;
  [3,4,5,6,7,8].forEach(function(x){
    document.getElementById('btn'+x).classList.toggle('active',x===n);
  });
  [3,4,5,6,7].forEach(function(i){
    document.getElementById('w'+i).style.display=((i+1)<=n)?'':'none';
  });
  // Role badges
  var roles=MODES[n];
  document.getElementById('rolesRow').innerHTML=roles.map(function(r){
    var isEvil=ROLE_INFO[r].team==='evil';
    return '<span class="rbadge'+(isEvil?' evil':'')+'" title="'+r+'">'+ROLE_INFO[r].emoji+' '+r+'</span>';
  }).join('');
  // Night order text
  document.getElementById('nightOrderTxt').innerText=
    NIGHT_ORDERS[n].map(function(r){return ROLE_INFO[r].emoji+' '+r;}).join(' → ');
}

// ═══════════════════════════════
// START GAME
// ═══════════════════════════════
function startGame(){
  var n=playerCount;
  players=[];
  for(var i=0;i<n;i++){
    players.push(document.getElementById('p'+i).value.trim()||DEFAULTS[i]);
  }
  shuffled=MODES[n].slice().sort(function(){return Math.random()-.5;});
  alive=players.map(function(){return true;});
  canVote=players.map(function(){return true;});
  nightOrder=NIGHT_ORDERS[n].slice();
  dealIdx=0;dealFlipped=false;
  wolfTarget=-1;guardTarget=-1;lastGuard=-1;
  witchHeal=true;witchPoison=true;witchSaving=false;witchPoisonTgt=-1;witchPoisonSel=-1;
  hunterSel=-1;hunterCallback=null;idiotCallback=null;
  roundNum=1;gameLog=[];villageWins=false;
  nightStepIdx=0;nightSel=-1;voteSelected=-1;
  setDay(false);renderScores();showDeal();
}

// ═══════════════════════════════
// DEAL
// ═══════════════════════════════
function showDeal(){
  var n=players.length;
  show('sDeal');dealFlipped=false;
  document.getElementById('dealCard').style.transform='';
  enableBtn('dealNext',false);
  document.getElementById('dealName').innerText=EMOJIS[dealIdx]+' '+players[dealIdx];
  document.getElementById('dealProg').innerText=(dealIdx+1)+'/'+n;
  document.getElementById('dealFill').style.width=((dealIdx+1)/n*100)+'%';
  var role=shuffled[dealIdx];
  var ri=ROLE_INFO[role];
  document.getElementById('dRoleEmoji').innerText=ri.emoji;
  document.getElementById('dRoleName').innerText=role;
  document.getElementById('dRoleDesc').innerText=ri.desc;
  // Wolves see each other
  var wolfSeeDiv=document.getElementById('dWolfSee');
  if(role==='怪盜'){
    var partners=[];
    shuffled.forEach(function(r,i){if(r==='怪盜'&&i!==dealIdx)partners.push(players[i]);});
    wolfSeeDiv.innerText=partners.length>0?'⚠️ 你的同伴：'+partners.join('、'):'（你是唯一的怪盜）';
  } else {
    wolfSeeDiv.innerText='';
  }
}

document.getElementById('cardScene').addEventListener('click',function(){
  if(dealFlipped)return;dealFlipped=true;sndFlip();
  document.getElementById('dealCard').style.transform='rotateY(180deg)';
  setTimeout(function(){enableBtn('dealNext',true);},880);
});

function dealNextPlayer(){
  sndClick();dealIdx++;
  if(dealIdx>=players.length){sndNight();show('sNightAnnounce');}
  else showDeal();
}

// ═══════════════════════════════
// NIGHT LOOP
// ═══════════════════════════════
function nightBegin(){nightStepIdx=0;doNightStep();}

function doNightStep(){
  if(nightStepIdx>=nightOrder.length){resolvNight();return;}
  var role=nightOrder[nightStepIdx];
  // Find first alive owner
  var ownerIdx=-1;
  shuffled.forEach(function(r,i){if(r===role&&alive[i]&&ownerIdx===-1)ownerIdx=i;});
  // If all owners dead, skip
  if(ownerIdx===-1){nightStepIdx++;doNightStep();return;}
  // Witch gets special UI
  if(role==='女巫'){doWitchNight();return;}
  // Build night action screen
  sndNight();nightSel=-1;
  show('sNightAction');enableBtn('nConfirm',false);
  document.getElementById('nIcon').innerText=ROLE_INFO[role].emoji;
  document.getElementById('seerBox').innerHTML='';
  document.getElementById('nTitle').innerText=ROLE_INFO[role].emoji+' '+role+'請睜眼';
  document.getElementById('nSub').innerText=
    role==='怪盜'?'選擇今晚要攻擊的目標（怪盜們一起商量）':
    role==='占星師'?'選擇你想查驗身份的人':
    '選擇今晚要保護的人';
  // Wolf partner info
  var wolfSeeBox=document.getElementById('wolfSeeBox');
  if(role==='怪盜'){
    var aliveWolves=[];
    shuffled.forEach(function(r,i){if(r==='怪盜'&&alive[i])aliveWolves.push(EMOJIS[i]+' '+players[i]);});
    wolfSeeBox.innerHTML=aliveWolves.length>1?'<div class="info-box box-wolf-see" style="margin-bottom:10px;">🐺 怪盜同伴：'+aliveWolves.join('、')+'</div>':'';
  } else {wolfSeeBox.innerHTML='';}
  // Build player cards
  var grid=document.getElementById('nGrid');
  grid.innerHTML='';
  grid.className=gridClass(players.length);
  for(var i=0;i<players.length;i++){
    var isDead=!alive[i];
    var isSelf=(i===ownerIdx);
    var isNoLast=(role==='守護者'&&i===lastGuard);
    // For wolves: can't pick other wolves
    var isWolfAlly=(role==='怪盜'&&shuffled[i]==='怪盜');
    var dis=isDead||isSelf||isNoLast||isWolfAlly;
    var card=document.createElement('div');
    card.className='psel-card'+(isDead?' dead':dis?' no-pick':'');
    card.dataset.idx=i;
    var hint='';
    if(isDead)hint='<span class="psel-tag tag-dead">已死亡</span>';
    if(isSelf||isWolfAlly)hint+='<div class="no-hint">不可選擇</div>';
    if(isNoLast)hint+='<div class="no-hint">上輪已保護</div>';
    card.innerHTML=hint+'<span class="psel-emoji">'+EMOJIS[i]+'</span><div class="psel-name">'+players[i]+'</div>';
    grid.appendChild(card);
  }
}

document.getElementById('nGrid').addEventListener('click',function(e){
  if(!document.getElementById('sNightAction').classList.contains('active'))return;
  var card=e.target.closest('.psel-card');
  if(!card||card.classList.contains('dead')||card.classList.contains('no-pick'))return;
  var i=parseInt(card.dataset.idx);
  var role=nightOrder[nightStepIdx];
  nightSel=i;sndClick();
  document.querySelectorAll('#nGrid .psel-card').forEach(function(c){c.classList.remove('sel-gold','sel-red');});
  card.classList.add(role==='怪盜'?'sel-red':'sel-gold');
  // Seer reveal
  if(role==='占星師'){
    var ri=ROLE_INFO[shuffled[i]];
    var isEvil=ri.team==='evil';
    document.getElementById('seerBox').innerHTML=
      '<div class="reveal-box"><span class="reveal-emoji">'+ri.emoji+'</span>'+
      '<div class="reveal-name">'+shuffled[i]+'</div>'+
      '<div class="reveal-team '+(isEvil?'team-evil':'team-good')+'">'+(isEvil?'⚠️ 壞人陣營':'✅ 好人陣營')+'</div>'+
      '</div>';
  }
  enableBtn('nConfirm',true);
});

function nightConfirm(){
  var role=nightOrder[nightStepIdx];
  if(role==='怪盜')wolfTarget=nightSel;
  if(role==='守護者'){guardTarget=nightSel;lastGuard=nightSel;}
  sndNight();
  document.getElementById('sleepTitle').innerText=ROLE_INFO[role].emoji+' '+role+'請閉眼';
  show('sNightSleep');
  nightStepIdx++;
}
function nightNextStep(){doNightStep();}

// ═══════════════════════════════
// WITCH NIGHT
// ═══════════════════════════════
function doWitchNight(){
  sndNight();witchPoisonSel=-1;witchSaving=false;
  show('sWitch');
  var witchOwner=-1;
  shuffled.forEach(function(r,i){if(r==='女巫'&&alive[i]&&witchOwner===-1)witchOwner=i;});
  // Heal section
  var healBlock=document.getElementById('wHealBlock');
  var attackInfo=document.getElementById('wAttackInfo');
  var healBtns=document.getElementById('wHealBtns');
  if(wolfTarget!==-1){
    attackInfo.innerText='😱 怪盜今晚攻擊了 '+EMOJIS[wolfTarget]+' '+players[wolfTarget];
    if(witchHeal){
      healBtns.innerHTML='<button class="w-btn w-btn-heal" id="wHealY" onclick="witchToggleHeal(true)">🧪 用解藥救他</button>'+
        '<button class="w-btn w-btn-skip" id="wHealN" onclick="witchToggleHeal(false)">不救</button>';
    } else {
      healBtns.innerHTML='<span style="color:#a09070;font-size:15px;">解藥已用完</span>';
    }
  } else {
    attackInfo.innerText='✨ 今晚沒有人被怪盜攻擊';
    healBtns.innerHTML='<span style="color:#a09070;font-size:15px;">無需使用解藥</span>';
  }
  // Poison section
  var poisonBlock=document.getElementById('wPoisonBlock');
  var poisonGrid=document.getElementById('wPoisonGrid');
  if(witchPoison){
    document.getElementById('wPoisonInfo').innerText='可選擇毒殺一人（點一下選，再點取消）';
    poisonGrid.innerHTML='';
    poisonGrid.className=gridClass(players.length);
    for(var i=0;i<players.length;i++){
      if(!alive[i])continue;
      var isSelf=(i===witchOwner);
      var card=document.createElement('div');
      card.className='psel-card'+(isSelf?' no-pick':'');
      card.dataset.idx=i;
      var hint=isSelf?'<div class="no-hint">不可選自己</div>':'';
      card.innerHTML=hint+'<span class="psel-emoji">'+EMOJIS[i]+'</span><div class="psel-name">'+players[i]+'</div>';
      poisonGrid.appendChild(card);
    }
    poisonBlock.style.display='';
  } else {
    poisonBlock.style.display='none';
  }
}
function witchToggleHeal(yes){
  witchSaving=yes;sndClick();
  var y=document.getElementById('wHealY'),n=document.getElementById('wHealN');
  if(y&&n){y.style.opacity=yes?'1':'.5';n.style.opacity=yes?'.5':'1';}
}
document.getElementById('wPoisonGrid').addEventListener('click',function(e){
  if(!document.getElementById('sWitch').classList.contains('active'))return;
  var card=e.target.closest('.psel-card');
  if(!card||card.classList.contains('no-pick'))return;
  var i=parseInt(card.dataset.idx);
  if(witchPoisonSel===i){
    witchPoisonSel=-1;
    document.querySelectorAll('#wPoisonGrid .psel-card').forEach(function(c){c.classList.remove('sel-red');});
  } else {
    witchPoisonSel=i;sndClick();
    document.querySelectorAll('#wPoisonGrid .psel-card').forEach(function(c){c.classList.remove('sel-red');});
    card.classList.add('sel-red');
  }
});
function witchDone(){
  if(witchSaving&&witchHeal)witchHeal=false;
  if(witchPoisonSel!==-1&&witchPoison){witchPoisonTgt=witchPoisonSel;witchPoison=false;}
  sndNight();
  document.getElementById('sleepTitle').innerText='🧙 女巫請閉眼';
  show('sNightSleep');nightStepIdx++;
}

// ═══════════════════════════════
// HUNTER
// ═══════════════════════════════
function triggerHunter(deadIdx, cb){
  hunterSel=-1;hunterCallback=cb;
  show('sHunter');
  document.getElementById('hunterLabel').innerText=
    EMOJIS[deadIdx]+' '+players[deadIdx]+' 臨死前可以射殺一個人！';
  enableBtn('hunterBtn',false);
  var grid=document.getElementById('hunterGrid');
  grid.innerHTML='';grid.className=gridClass(players.length);
  for(var i=0;i<players.length;i++){
    if(!alive[i]||i===deadIdx)continue;
    var card=document.createElement('div');
    card.className='psel-card';card.dataset.idx=i;
    card.innerHTML='<span class="psel-emoji">'+EMOJIS[i]+'</span><div class="psel-name">'+players[i]+'</div>';
    grid.appendChild(card);
  }
}
document.getElementById('hunterGrid').addEventListener('click',function(e){
  if(!document.getElementById('sHunter').classList.contains('active'))return;
  var card=e.target.closest('.psel-card');if(!card)return;
  hunterSel=parseInt(card.dataset.idx);sndClick();
  document.querySelectorAll('#hunterGrid .psel-card').forEach(function(c){c.classList.remove('sel-red');});
  card.classList.add('sel-red');enableBtn('hunterBtn',true);
});
function hunterFire(){
  if(hunterSel<0)return;
  alive[hunterSel]=false;sndHunter();
  gameLog.push('🏹 獵人射殺了 '+players[hunterSel]+'（'+shuffled[hunterSel]+'）');
  if(hunterCallback)hunterCallback(hunterSel);
}

// ═══════════════════════════════
// RESOLVE NIGHT
// ═══════════════════════════════
function resolvNight(){
  var savedWPT=witchPoisonTgt;
  var nightKilled=-1;
  var newsHTML='';var logItems=[];

  // Wolf attack
  if(wolfTarget!==-1){
    if(wolfTarget===guardTarget||witchSaving){
      newsHTML+='<div class="info-box box-safe">🛡 今晚有人獲救！<br>'+EMOJIS[wolfTarget]+' <strong>'+players[wolfTarget]+'</strong> 平安無事。</div>';
      logItems.push(players[wolfTarget]+' 被攻擊但獲救');
    } else {
      alive[wolfTarget]=false;nightKilled=wolfTarget;
      newsHTML+='<div class="info-box box-death">💀 '+EMOJIS[wolfTarget]+' <strong>'+players[wolfTarget]+'</strong><br>在夜晚死亡，被怪盜帶走了…</div>';
      logItems.push(players[wolfTarget]+' 被怪盜殺死');
    }
  } else {
    if(!witchSaving){
      newsHTML+='<div class="info-box box-safe">✨ 昨晚風平浪靜，沒有人死亡</div>';
      logItems.push('平安夜');
    }
  }
  // Witch poison
  if(savedWPT!==-1){
    alive[savedWPT]=false;
    newsHTML+='<div class="info-box box-death">☠️ '+EMOJIS[savedWPT]+' <strong>'+players[savedWPT]+'</strong><br>被女巫毒殺了！</div>';
    logItems.push(players[savedWPT]+' 被女巫毒殺');
  }
  // Reset night state
  wolfTarget=-1;guardTarget=-1;witchSaving=false;witchPoisonTgt=-1;witchPoisonSel=-1;
  gameLog.push('第'+roundNum+'夜：'+logItems.join('、'));
  document.getElementById('roundNum').innerText=roundNum;
  roundNum++;
  document.getElementById('dawnNews').innerHTML=newsHTML;
  document.getElementById('dawnLog').innerHTML=gameLog.join('<br>');

  // Check hunter trigger from night deaths
  var deadHunterIdx=-1;
  if(nightKilled!==-1&&shuffled[nightKilled]==='獵人')deadHunterIdx=nightKilled;
  else if(savedWPT!==-1&&shuffled[savedWPT]==='獵人')deadHunterIdx=savedWPT;

  function finishDawn(){
    sndDawn();setDay(true);show('sDawn');
    checkWin();
  }
  if(deadHunterIdx!==-1){
    var cap=deadHunterIdx;
    triggerHunter(cap,function(shot){
      document.getElementById('dawnNews').innerHTML+=
        '<div class="info-box box-hunter">🏹 獵人 <strong>'+players[cap]+'</strong><br>臨死前射殺了 '+EMOJIS[shot]+' <strong>'+players[shot]+'</strong>！</div>';
      document.getElementById('dawnLog').innerHTML=gameLog.join('<br>');
      finishDawn();
    });
  } else {
    finishDawn();
  }
}

// ═══════════════════════════════
// DAY PHASE
// ═══════════════════════════════
function goDiscuss(){
  setDay(true);show('sDiscuss');
  var bar='';
  for(var i=0;i<players.length;i++){
    var cls=!alive[i]?'dead':(!canVote[i]?'no-vote':'alive');
    bar+='<div class="status-pip '+cls+'">'+EMOJIS[i]+' '+players[i]+(!canVote[i]&&alive[i]?' 🚫':'')+'</div>';
  }
  document.getElementById('discStatus').innerHTML=bar;
  startTimer(60);
}
function startTimer(sec){
  var circle=document.getElementById('tCircle'),num=document.getElementById('tNum');
  var circ=2*Math.PI*47;
  clearInterval(timerInv);var t=sec;
  num.innerText=t;circle.style.strokeDasharray=circ;circle.style.strokeDashoffset=0;circle.style.stroke='var(--gold2)';
  timerInv=setInterval(function(){
    t--;num.innerText=t;
    circle.style.strokeDashoffset=circ*(1-t/sec);
    if(t<=10){circle.style.stroke='#cc2020';sndTick();}
    if(t<=0){clearInterval(timerInv);goVote();}
  },1000);
}
function goVote(){
  clearInterval(timerInv);setDay(true);show('sVote');
  voteSelected=-1;enableBtn('voteBtn',false);
  var grid=document.getElementById('voteGrid');
  grid.innerHTML='';grid.className=gridClass(players.length);
  for(var i=0;i<players.length;i++){
    if(!alive[i])continue;
    var card=document.createElement('div');
    card.className='psel-card';card.dataset.idx=i;
    var hint=!canVote[i]?'<div class="no-hint">🚫 不能投票</div>':'';
    card.innerHTML=hint+'<span class="psel-emoji">'+EMOJIS[i]+'</span><div class="psel-name">'+players[i]+'</div>';
    grid.appendChild(card);
  }
}
document.getElementById('voteGrid').addEventListener('click',function(e){
  if(!document.getElementById('sVote').classList.contains('active'))return;
  var card=e.target.closest('.psel-card');if(!card)return;
  voteSelected=parseInt(card.dataset.idx);sndClick();
  document.querySelectorAll('#voteGrid .psel-card').forEach(function(c){c.classList.remove('sel-red','sel-gold');});
  card.classList.add('sel-red');enableBtn('voteBtn',true);
});

function confirmVote(){
  if(voteSelected<0)return;
  var vi=voteSelected;
  var role=shuffled[vi];

  // Idiot special: survives vote
  if(role==='白痴'&&canVote[vi]){
    canVote[vi]=false; // reveal = lose vote right
    var msg=EMOJIS[vi]+' '+players[vi]+' 是白痴！身份曝光後保住了性命，但從此不能投票。';
    document.getElementById('idiotMsg').innerText=msg;
    gameLog.push('第'+(roundNum-1)+'天：'+players[vi]+'（白痴）曝光但存活');
    idiotCallback=function(){
      if(checkWin())return;
      nightStepIdx=0;nightSel=-1;wolfTarget=-1;guardTarget=-1;witchSaving=false;witchPoisonTgt=-1;
      setDay(false);show('sNightAnnounce');
    };
    show('sIdiot');return;
  }

  // Normal elimination
  alive[vi]=false;
  gameLog.push('第'+(roundNum-1)+'天：投票放逐 '+players[vi]+'（'+role+'）');

  function afterVote(){
    if(checkWin())return;
    nightStepIdx=0;nightSel=-1;wolfTarget=-1;guardTarget=-1;witchSaving=false;witchPoisonTgt=-1;
    setDay(false);show('sNightAnnounce');
  }
  if(role==='獵人'){
    triggerHunter(vi,function(shot){
      gameLog.push('🏹 獵人射殺了 '+players[shot]);
      afterVote();
    });
  } else {
    afterVote();
  }
}
function afterIdiotReveal(){if(idiotCallback)idiotCallback();}

// ═══════════════════════════════
// WIN CHECK
// ═══════════════════════════════
function checkWin(){
  var wolfAlive=0,goodAlive=0;
  shuffled.forEach(function(r,i){
    if(!alive[i])return;
    if(r==='怪盜')wolfAlive++;else goodAlive++;
  });
  if(wolfAlive===0){endGame(true);return true;}
  if(wolfAlive>=goodAlive){endGame(false);return true;}
  return false;
}

// ═══════════════════════════════
// END GAME
// ═══════════════════════════════
function endGame(vWin){
  clearInterval(timerInv);setDay(vWin);show('sOver');villageWins=vWin;
  if(vWin){
    sndWin();confetti();
    document.getElementById('overIcon').innerText='🎉';
    document.getElementById('overTitle').innerText='守護陣營勝利！';
    document.getElementById('overTitle').style.color='#c9a030';
    document.getElementById('overDetail').innerText='家族成功識破了怪盜！';
  } else {
    sndLose();
    document.getElementById('overIcon').innerText='💀';
    document.getElementById('overTitle').innerText='怪盜勝利！';
    document.getElementById('overTitle').style.color='#cc2020';
    var wn=players.filter(function(p,i){return shuffled[i]==='怪盜';}).join('、');
    document.getElementById('overDetail').innerText='怪盜 '+wn+' 成功潛伏，家族被攻破…';
  }
  var h='<div class="rr-head"><span>玩家</span><span>角色</span></div>';
  for(var i=0;i<players.length;i++){
    var ri=ROLE_INFO[shuffled[i]];
    var tags='';
    if(!alive[i])tags+='<span class="rr-tag rr-tag-dead">出局</span>';
    else if(!canVote[i])tags+='<span class="rr-tag rr-tag-idiot">白痴存活</span>';
    h+='<div class="rr-row"><span>'+EMOJIS[i]+' '+players[i]+'</span><span class="rr-role">'+ri.emoji+' '+shuffled[i]+tags+'</span></div>';
  }
  document.getElementById('rrTable').innerHTML=h;
}

function saveAndRestart(){
  var o=getScores();
  if(villageWins){
    players.forEach(function(p,i){if(shuffled[i]!=='怪盜'&&(p in o))o[p]+=1;});
  } else {
    players.forEach(function(p,i){if(shuffled[i]==='怪盜'&&(p in o))o[p]+=1;});
  }
  saveScores(o);renderScores();showToast('🏆 記分完成！');
  setTimeout(function(){setDay(false);startGame();},1200);
}
function goHome(){clearInterval(timerInv);setDay(false);show('sOpening');renderScores();}

// ═══════════════════════════════
// INIT
// ═══════════════════════════════
renderScores();
setCount(4);
</script>
